title: Almost Surely
tagline: Personal Research Notebook
description: >-
  금융공학, 자산가격론, 금리·환율·크레딧 시장을 수식과 짧은 리서치 노트로 정리하는 개인 아카이브입니다.

url: "https://Youngwo0.github.io"
baseurl: ""

lang: ko-KR
timezone: Asia/Seoul

author:
  name: Youngwoo Lee
  email: youngwoo.lee.kr@gmail.com

github_username: Youngwo0
linkedin_username: youngwoo-lee-a38b89263

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /writing/:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# 메인 Writing 목록에서 제외할 카테고리 (Daily Brief 계열)
hidden_categories:
  - Daily Brief
  - Daily Macro Brief

sass:
  style: compressed

exclude:
  - "*.gemspec"
  - notes
  - tools
  - README.md
  - CHANGELOG.md
  - LICENSE
  - gulpfile.js
  - node_modules
  - "package*.json"
  - Gemfile.lock
  - ".claude"
